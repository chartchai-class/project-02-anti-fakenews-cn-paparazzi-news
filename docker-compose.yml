version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: antifakenews-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpwd
      - MYSQL_DATABASE=antifakenews
      - MYSQL_USER=antifake
      - MYSQL_PASSWORD=antifakepwd
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
volumes:
  db_data:
